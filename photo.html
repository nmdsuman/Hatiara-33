<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generative Fill Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .canvas-container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }
        #baseCanvas, #drawingCanvas {
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 8px;
        }
        #baseCanvas { z-index: 1; }
        #drawingCanvas { z-index: 2; cursor: crosshair; }
        .placeholder-text {
            position: relative;
            z-index: 0;
            padding: 50px;
            color: #6b7280;
            text-align: center;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4 md:p-6 font-sans">

    <div class="max-w-3xl w-full bg-gray-800 p-6 md:p-8 rounded-xl shadow-2xl">
        <h1 class="text-2xl md:text-3xl font-bold text-center text-blue-400 mb-2">AI Generative Fill</h1>
        <p class="text-center text-gray-400 mb-6 text-sm md:text-base">Chhobi upload korun, mask korun ebong ai diye change korun.</p>

        <!-- API Key Section -->
        <div class="mb-6 bg-gray-700 p-4 rounded-lg border border-gray-600">
            <label class="block text-sm font-medium text-gray-300 mb-2">Hugging Face API Token:</label>
            <input type="text" id="hfTokenInput" value="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" class="w-full px-3 py-2 bg-gray-900 border border-gray-600 rounded-md focus:outline-none focus:border-blue-500 text-white text-sm">
        </div>

        <!-- Image Upload Section -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-300 mb-2">Chhobi Upload Korun:</label>
            <input type="file" id="imageUpload" accept="image/*" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer bg-gray-700 rounded-md">
        </div>

        <!-- Canvas Area -->
        <div class="flex flex-col items-center border-2 border-dashed border-gray-600 rounded-lg bg-gray-900 overflow-hidden relative w-full overflow-x-auto" id="workspace" style="min-height: 250px;">
            <p id="placeholderText" class="placeholder-text">Chhobi ekhane dekhabe...<br><span class="text-xs text-gray-500">(Boro chhobi automatic resize hobe)</span></p>
            <div id="canvasContainer" class="canvas-container hidden">
                <canvas id="baseCanvas"></canvas>
                <canvas id="drawingCanvas"></canvas>
            </div>
        </div>

        <!-- Controls -->
        <div class="mt-4 flex flex-col md:flex-row justify-between items-center hidden gap-4" id="brushControls">
            <div class="flex items-center gap-3 w-full md:w-auto">
                <label class="text-sm text-gray-400 whitespace-nowrap">Brush Size:</label>
                <input type="range" id="brushSize" min="5" max="100" value="30" class="cursor-pointer w-full md:w-32">
            </div>
            <button id="clearMaskBtn" class="w-full md:w-auto text-sm bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-white font-medium">Mask Clear Korun</button>
        </div>

        <!-- Prompt and Generate -->
        <div class="mt-8 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Ki toiri korte chan? (Prompt):</label>
                <p class="text-xs text-gray-400 mb-2">💡 Tip: Kono kichu replace ba add korte chaile ta english e likhun (Jemon: "a red car", "empty background").</p>
                <input type="text" id="promptInput" placeholder="Jemon: A beautiful background, trees..." class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
            </div>

            <button id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                Generative Fill Korun
            </button>
        </div>

        <!-- Status & Result -->
        <div id="statusText" class="mt-6 text-center text-yellow-400 font-medium hidden p-3 bg-yellow-900 bg-opacity-20 rounded border border-yellow-700"></div>

        <div id="resultArea" class="mt-8 hidden flex flex-col items-center">
            <h2 class="text-xl font-bold text-green-400 mb-4">Result:</h2>
            <img id="resultImage" src="" alt="Generated Result" class="max-w-full rounded-lg shadow-lg border border-gray-600">
            <a id="downloadBtn" href="#" download="ai-generated.png" class="mt-4 bg-green-600 hover:bg-green-700 px-6 py-2 rounded font-bold text-white">Chhobi Download Korun</a>
        </div>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const workspace = document.getElementById('workspace');
        const placeholderText = document.getElementById('placeholderText');
        const canvasContainer = document.getElementById('canvasContainer');
        const baseCanvas = document.getElementById('baseCanvas');
        const drawingCanvas = document.getElementById('drawingCanvas');
        const brushControls = document.getElementById('brushControls');
        const brushSizeInput = document.getElementById('brushSize');
        const clearMaskBtn = document.getElementById('clearMaskBtn');
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const statusText = document.getElementById('statusText');
        const resultArea = document.getElementById('resultArea');
        const resultImage = document.getElementById('resultImage');
        const downloadBtn = document.getElementById('downloadBtn');
        const hfTokenInput = document.getElementById('hfTokenInput');

        const baseCtx = baseCanvas.getContext('2d', { willReadFrequently: true });
        const drawCtx = drawingCanvas.getContext('2d', { willReadFrequently: true });

        const maskCanvas = document.createElement('canvas');
        const maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });

        let isDrawing = false;
        let originalImageStr = null;

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const maxWidth = 512;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.floor(height * (maxWidth / width));
                        width = maxWidth;
                    }

                    baseCanvas.width = width;
                    baseCanvas.height = height;
                    drawingCanvas.width = width;
                    drawingCanvas.height = height;
                    maskCanvas.width = width;
                    maskCanvas.height = height;

                    canvasContainer.style.width = width + 'px';
                    canvasContainer.style.height = height + 'px';

                    baseCtx.drawImage(img, 0, 0, width, height);
                    originalImageStr = baseCanvas.toDataURL("image/jpeg", 0.9);

                    drawCtx.lineCap = 'round';
                    drawCtx.lineJoin = 'round';
                    
                    maskCtx.fillStyle = 'black';
                    maskCtx.fillRect(0, 0, width, height);
                    maskCtx.lineCap = 'round';
                    maskCtx.lineJoin = 'round';

                    placeholderText.classList.add('hidden');
                    canvasContainer.classList.remove('hidden');
                    brushControls.classList.remove('hidden');
                    resultArea.classList.add('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function startPosition(e) {
            isDrawing = true;
            draw(e);
        }
        function endPosition() {
            isDrawing = false;
            drawCtx.beginPath();
            maskCtx.beginPath();
        }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const rect = drawingCanvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const scaleX = drawingCanvas.width / rect.width;
            const scaleY = drawingCanvas.height / rect.height;
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;

            const brushSize = brushSizeInput.value;

            drawCtx.lineWidth = brushSize;
            drawCtx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
            drawCtx.lineTo(x, y);
            drawCtx.stroke();
            drawCtx.beginPath();
            drawCtx.moveTo(x, y);

            maskCtx.lineWidth = brushSize;
            maskCtx.strokeStyle = 'white';
            maskCtx.lineTo(x, y);
            maskCtx.stroke();
            maskCtx.beginPath();
            maskCtx.moveTo(x, y);
        }

        drawingCanvas.addEventListener('mousedown', startPosition);
        drawingCanvas.addEventListener('mouseup', endPosition);
        drawingCanvas.addEventListener('mouseout', endPosition);
        drawingCanvas.addEventListener('mousemove', draw);

        drawingCanvas.addEventListener('touchstart', startPosition, { passive: false });
        drawingCanvas.addEventListener('touchend', endPosition, { passive: false });
        drawingCanvas.addEventListener('touchcancel', endPosition, { passive: false });
        drawingCanvas.addEventListener('touchmove', draw, { passive: false });

        clearMaskBtn.addEventListener('click', () => {
            drawCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            maskCtx.fillStyle = 'black';
            maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
        });

        const delay = ms => new Promise(res => setTimeout(res, ms));

        generateBtn.addEventListener('click', async () => {
            const hfToken = hfTokenInput.value.trim();
            const promptText = promptInput.value.trim();

            if (!hfToken.startsWith("hf_")) {
                alert("Token ti 'hf_' diye shuru hote hobe.");
                return;
            }
            if (!originalImageStr) {
                alert("Prothome ekta chhobi upload korun!");
                return;
            }
            if (!promptText) {
                alert("Prompt faka rakha jabe na!");
                return;
            }

            const imageBase64 = originalImageStr.split(',')[1];
            const maskBase64 = maskCanvas.toDataURL("image/png").split(',')[1];

            generateBtn.disabled = true;
            generateBtn.innerText = "Toiri hocche...";
            statusText.classList.remove('hidden');
            statusText.innerText = "Chhobi toiri kora hocche, kichukhon opekkha korun...";
            resultArea.classList.add('hidden');

            const maxRetries = 3;
            let attempt = 0;
            let success = false;

            while (attempt < maxRetries && !success) {
                try {
                    const response = await fetch(
                        "https://api-inference.huggingface.co/models/runwayml/stable-diffusion-inpainting",
                        {
                            method: "POST",
                            headers: {
                                "Authorization": `Bearer ${hfToken}`,
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({
                                inputs: promptText,
                                image: imageBase64,
                                mask_image: maskBase64
                            }),
                        }
                    );

                    if (response.ok) {
                        const blob = await response.blob();
                        const objectURL = URL.createObjectURL(blob);
                        resultImage.src = objectURL;
                        downloadBtn.href = objectURL;
                        resultArea.classList.remove('hidden');
                        success = true;
                        break;
                    } 
                    
                    const errorJson = await response.json().catch(() => null);
                    
                    if (response.status === 503 && errorJson && errorJson.estimated_time) {
                        const waitTime = Math.ceil(errorJson.estimated_time);
                        statusText.innerText = `API Model ti ghum theke uthche 😅. ${waitTime} second opekkha korun...`;
                        await delay(waitTime * 1000);
                        attempt++;
                        statusText.innerText = "Abar try kora hocche...";
                    } else {
                        const errMsg = errorJson && errorJson.error ? errorJson.error : `HTTP Status: ${response.status}`;
                        throw new Error(errMsg);
                    }

                } catch (error) {
                    console.error("API Error:", error);
                    alert(`Shomossha hoyeche: \n\n${error.message}`);
                    break;
                }
            }

            if (!success && attempt >= maxRetries) {
                alert("Onekbar try korar por o holo na. API ekhon khub busy.");
            }

            generateBtn.disabled = false;
            generateBtn.innerText = "Generative Fill Korun";
            statusText.classList.add('hidden');
        });
    </script>
</body>
</html>
