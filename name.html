<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাল্টিপল নাম ম্যানেজমেন্ট - Firestore</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- কনফিগারেশন ফাইল -->
    <script src="firebase-config.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-800 p-6 rounded-2xl shadow-xl w-full max-w-md border border-gray-700">
        <h2 class="text-2xl font-bold text-center text-yellow-400 mb-6">Firestore নাম ম্যানেজমেন্ট</h2>
        
        <!-- ইনপুট ফর্ম -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">নতুন নাম লিখুন</label>
                <input type="text" id="nameInput" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-yellow-400" placeholder="একটি নাম লিখুন...">
            </div>

            <button id="saveBtn" onclick="saveName()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2.5 rounded-lg transition duration-200">
                সেভ করুন
            </button>
        </div>

        <hr class="border-gray-700 my-6">

        <!-- সেভ হওয়া নামের তালিকা দেখানোর সেকশন -->
        <div>
            <h3 class="text-sm font-medium text-gray-400 mb-2">ডাটাবেসে থাকা নামের তালিকা:</h3>
            <div id="namesList" class="space-y-2">
                <p class="text-gray-400 text-center py-2">লোডিং...</p>
            </div>
        </div>
    </div>

    <script>
        // Firestore Collection রেফারেন্স (এখানে সব নাম আলাদা ডকুমেন্ট হিসেবে জমা হবে)
        const namesCollection = db.collection("namesList");

        // ১. নতুন নাম যোগ করার ফাংশন (Add Item)
        function saveName() {
            const inputVal = document.getElementById("nameInput").value.trim();
            if (!inputVal) {
                alert("দয়া করে একটি নাম লিখুন!");
                return;
            }

            // docRef.set() এর বদলে collection.add() ব্যবহার করা হয়েছে
            namesCollection.add({
                name: inputVal,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                document.getElementById("nameInput").value = "";
            })
            .catch((error) => {
                alert("এরর: " + error.message);
            });
        }

        // ২. রিয়েল-টাইমে সব নাম পড়া ও লিস্ট আকারে দেখানো (Real-time List)
        namesCollection.orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            const listArea = document.getElementById("namesList");
            listArea.innerHTML = "";

            if (snapshot.empty) {
                listArea.innerHTML = `<p class="text-gray-400 text-center py-2">কোনো নাম পাওয়া যায়নি</p>`;
                return;
            }

            snapshot.forEach((doc) => {
                const item = doc.data();
                const docId = doc.id;

                const nameDiv = document.createElement("div");
                nameDiv.className = "bg-gray-700 p-3 rounded-lg flex items-center justify-between";
                nameDiv.innerHTML = `
                    <span class="text-base font-semibold text-yellow-300">${item.name}</span>
                    <div class="space-x-2">
                        <button onclick="editName('${docId}', '${item.name}')" class="bg-blue-600 hover:bg-blue-700 text-xs px-3 py-1.5 rounded font-medium text-white transition">এডিট</button>
                        <button onclick="deleteName('${docId}')" class="bg-red-600 hover:bg-red-700 text-xs px-3 py-1.5 rounded font-medium text-white transition">ডিলিট</button>
                    </div>
                `;
                listArea.appendChild(nameDiv);
            });
        }, (error) => {
            console.error("ডেটা আনতে সমস্যা হয়েছে:", error);
            document.getElementById("namesList").innerHTML = `<p class="text-red-400 text-center">এরর হয়েছে!</p>`;
        });

        // ৩. নির্দিষ্ট নাম এডিট করা
        function editName(id, currentName) {
            const newName = prompt("নতুন নাম লিখুন:", currentName);
            if (newName !== null && newName.trim() !== "") {
                namesCollection.doc(id).update({
                    name: newName.trim()
                })
                .catch((error) => {
                    alert("এডিট করতে সমস্যা হয়েছে: " + error.message);
                });
            }
        }

        // ৪. নির্দিষ্ট নাম ডিলিট করা
        function deleteName(id) {
            if (confirm("আপনি কি নিশ্চিতভাবে এই নাম ডিলিট করতে চান?")) {
                namesCollection.doc(id).delete()
                .catch((error) => {
                    alert("ডিলিট করতে সমস্যা হয়েছে: " + error.message);
                });
            }
        }
    </script>
</body>
</html>
