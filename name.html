<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Default Players Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">ডিফোল্ট প্লেয়ার ম্যানেজমেন্ট</h2>
        
        <div class="flex space-x-2 mb-4">
            <input type="text" id="newPlayerName" placeholder="নতুন প্লেয়ারের নাম" class="flex-grow px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="addPlayerBtn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg">যোগ করুন</button>
        </div>

        <div id="playersList" class="space-y-2 max-h-60 overflow-y-auto mb-4 border p-2 rounded-lg">
            <p class="text-center text-gray-500">ডাটা লোড হচ্ছে...</p>
        </div>

        <div class="text-center">
            <a href="index.html" class="text-blue-500 hover:underline">← হোমে ফিরে যান</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 🔥 আপনার Firebase Config দিয়ে প্রতিস্থাপন করুন
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const playersRef = ref(db, 'defaultPlayers');

        let defaultPlayers = [];

        const render = () => {
            const container = document.getElementById('playersList');
            container.innerHTML = '';
            if(defaultPlayers.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400">কোনো প্লেয়ার নেই</p>';
                return;
            }
            defaultPlayers.forEach((player, index) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-50 p-2 rounded border";
                div.innerHTML = `
                    <span class="font-medium text-gray-700">${player}</span>
                    <button onclick="removePlayer(${index})" class="bg-red-500 text-white text-sm px-2 py-1 rounded hover:bg-red-600">ডিলিট</button>
                `;
                container.appendChild(div);
            });
        };

        // Realtime Data Sync
        onValue(playersRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                defaultPlayers = Array.isArray(data) ? data : Object.values(data);
                localStorage.setItem('presetPlayers', JSON.stringify(defaultPlayers));
                localStorage.setItem('playerNames', JSON.stringify(defaultPlayers));
            } else {
                defaultPlayers = [];
            }
            render();
        });

        document.getElementById('addPlayerBtn').addEventListener('click', () => {
            const input = document.getElementById('newPlayerName');
            const name = input.value.trim();
            if(name && !defaultPlayers.includes(name)) {
                defaultPlayers.push(name);
                set(playersRef, defaultPlayers);
                input.value = '';
            }
        });

        window.removePlayer = (index) => {
            defaultPlayers.splice(index, 1);
            set(playersRef, defaultPlayers);
        };
    </script>
</body>
</html>
