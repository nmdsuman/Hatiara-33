<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>খেলোয়াড়দের নাম সেটআপ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Core & Firestore SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-800 p-6 rounded-2xl shadow-xl w-full max-w-md border border-gray-700">
        <h2 class="text-2xl font-bold text-center text-yellow-400 mb-6">খেলোয়াড়দের নাম সেট করুন</h2>
        
        <form id="nameForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">প্লেয়ার ১</label>
                <input type="text" id="player1_input" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-yellow-400" placeholder="প্লেয়ার ১ এর নাম">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">প্লেয়ার ২</label>
                <input type="text" id="player2_input" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-yellow-400" placeholder="প্লেয়ার ২ এর নাম">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">প্লেয়ার ৩</label>
                <input type="text" id="player3_input" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-yellow-400" placeholder="প্লেয়ার ৩ এর নাম">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">প্লেয়ার ৪</label>
                <input type="text" id="player4_input" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-yellow-400" placeholder="প্লেয়ার ৪ এর নাম">
            </div>

            <button type="button" id="saveNamesBtn" class="w-full mt-4 bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-3 rounded-lg transition duration-200">
                নাম সেভ করুন
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="index_2.html" class="text-sm text-gray-400 hover:text-white underline">হোম পেজে ফিরে যান</a>
        </div>
    </div>

    <!-- Firebase Config File -->
    <script src="firebase-config.js"></script>

    <script>
        // পেজ লোড হলে Firestore বা LocalStorage থেকে নাম লোড হবে
        document.addEventListener("DOMContentLoaded", () => {
            // Firestore থেকে লাইভ নাম লোড
            if (typeof listenToPlayerNames === "function") {
                listenToPlayerNames((names) => {
                    if (names && names.length >= 4) {
                        document.getElementById("player1_input").value = names[0] || "";
                        document.getElementById("player2_input").value = names[1] || "";
                        document.getElementById("player3_input").value = names[2] || "";
                        document.getElementById("player4_input").value = names[3] || "";
                    }
                });
            } else {
                // অফলাইন বা ব্যাকআপ হিসেবে LocalStorage থেকে লোড
                const savedNames = JSON.parse(localStorage.getItem("presetPlayers"));
                if (savedNames && savedNames.length >= 4) {
                    document.getElementById("player1_input").value = savedNames[0] || "";
                    document.getElementById("player2_input").value = savedNames[1] || "";
                    document.getElementById("player3_input").value = savedNames[2] || "";
                    document.getElementById("player4_input").value = savedNames[3] || "";
                }
            }
        });

        // সেভ বাটনে ক্লিক করলে নাম Firestore ও LocalStorage-এ সেভ হবে
        document.getElementById("saveNamesBtn").addEventListener("click", function() {
            const p1 = document.getElementById("player1_input").value.trim() || "Player 1";
            const p2 = document.getElementById("player2_input").value.trim() || "Player 2";
            const p3 = document.getElementById("player3_input").value.trim() || "Player 3";
            const p4 = document.getElementById("player4_input").value.trim() || "Player 4";

            const playerNames = [p1, p2, p3, p4];

            // LocalStorage আপডেট
            localStorage.setItem("presetPlayers", JSON.stringify(playerNames));

            // Firestore Database-এ সেভ
            if (typeof savePlayerNamesToFirestore === "function") {
                savePlayerNamesToFirestore(playerNames);
            }

            alert("প্লেয়ারদের নাম সফলভাবে সেভ হয়েছে!");
        });
    </script>
</body>
</html>
